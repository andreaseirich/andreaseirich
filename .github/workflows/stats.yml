name: GitHub stats

# Renders the stats cards for the profile README with scripts/stats.py and
# publishes them to the orphan branch "stats", so main gets no daily commits.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check third-party card services (temporary diagnostic)
        continue-on-error: true
        run: |
          for url in \
            "https://github-readme-stats.vercel.app/api?username=andreaseirich&theme=dark" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=andreaseirich&theme=dark&layout=compact" \
            "https://nirzak-streak-stats.vercel.app/?user=andreaseirich&theme=dark" \
            "https://streak-stats.demolab.com/?user=andreaseirich&theme=dark"; do
            code=$(curl -s -o body.txt -m 30 -w '%{http_code} %{content_type}' "$url" || echo "curl-failed")
            echo "== $code  $url"
            head -c 400 body.txt | tr '\n' ' '; echo
          done

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 scripts/stats.py --user "${{ github.repository_owner }}" --out output

      - name: Publish to the stats branch
        working-directory: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b stats
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update GitHub stats"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
